<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{{ page.title | default: site.title }}</title>
  <meta name="description" content="{{ page.description | default: site.description }}" />

  <!-- Google Fonts: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <!-- Bootstrap CSS -->
  <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
  />

  <!-- Custom CSS -->
  <link rel="stylesheet" href="{{ '/style.css' | relative_url }}" />
</head>
<body>

  <!-- HEADER / NAVBAR -->
  <a class="skip-link" href="#main-content">Skip to content</a>
  <nav class="navbar navbar-expand-md navbar-dark bg-dark site-nav" aria-label="Main navigation">
    <div class="site-container">
      <a href="{{ '/index.html' | relative_url }}" class="navbar-brand">
        Chenmu
      </a>

      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
              aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>

      <div class="collapse navbar-collapse justify-content-end" id="navbarNav">
        <ul class="navbar-nav">
          <li class="nav-item">
            <a href="{{ '/index.html' | relative_url }}" class="nav-link"{% if page.url == '/' or page.url == '/index.html' %} aria-current="page"{% endif %}>
              Research
            </a>
          </li>
          <li class="nav-item">
            <a href="{{ '/publications.html' | relative_url }}" class="nav-link"{% if page.url == '/publications.html' %} aria-current="page"{% endif %}>
              Publications
            </a>
          </li>
          <li class="nav-item">
            <a href="{{ '/bio.html' | relative_url }}" class="nav-link"{% if page.url == '/bio.html' %} aria-current="page"{% endif %}>
              Bio
            </a>
          </li>
        </ul>
      </div>
    </div>
  </nav>

  <div id="main-content" tabindex="-1">
    {{ content }}
  </div>

  <!-- FOOTER -->
  <footer class="site-footer">
    <div class="site-container">
      <p class="m-0">&copy; {{ site.time | date: '%Y' }} Powered by Claude Code (Fable 5.1)</p>
    </div>
  </footer>

  <!-- Bootstrap JS -->
  <script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js">
  </script>
</body>
</html>
